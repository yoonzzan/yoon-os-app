name: app-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest -v tests.test_publish_branch
      - run: python3 -m py_compile scripts/publish_branch.py
      - run: node --test tests/release-verifier.test.mjs
