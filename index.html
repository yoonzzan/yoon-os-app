<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16150f">
<title>기록</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23b9542a'/%3E%3Ctext x='90' y='124' font-size='96' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E2%9C%8E%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#faf9f7; --card:#fff; --ink:#1c1b19; --dim:#7a756e; --line:#e6e2dc;
    --accent:#b9542a; --ok:#3f7d58;
    --c1:#5b7fa6; --c2:#3f7d58; --c3:#b9542a; --c4:#7a6ba6; --c5:#c08a2e; --c6:#4f8f8a;
    --c7:#a8617e; --c8:#8a6a4f;
    --sb:env(safe-area-inset-bottom,0px);
    --st:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16150f; --card:#1f1e19; --ink:#efece5; --dim:#948e84; --line:#312f28; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    overscroll-behavior-y:none}
  /* 홈 화면에 추가하면 상태바 아래로 내용이 들어갑니다 — 안전영역만큼 밀어줍니다 */
  .wrap{max-width:760px;margin:0 auto;
    padding:calc(12px + var(--st)) 14px calc(30px + var(--sb))}
  [hidden]{display:none !important}
  input,textarea,select,button{font:inherit}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;padding:11px 0;border:1px solid transparent;border-radius:11px;
    background:transparent;color:var(--dim);font-size:14px;cursor:pointer}
  .tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}

  .modes{display:flex;gap:5px;margin-bottom:12px}
  .modes button{flex:1;padding:7px 0;border:none;border-radius:9px;background:transparent;
    color:var(--dim);font-size:13px;cursor:pointer}
  .modes button.on{background:var(--card);color:var(--ink);font-weight:600}

  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
  @media(min-width:560px){ .types{grid-template-columns:repeat(8,1fr)} }
  .types button{padding:12px 2px 9px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--dim);font-size:11.5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px}
  .types button .e{font-size:20px;line-height:1}
  .types button.on{border-color:var(--accent);background:var(--accent);color:#fff}

  textarea,input[type=text]{width:100%;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:12px;padding:13px;resize:none;outline:none}
  textarea:focus,input:focus{border-color:var(--accent)}
  textarea{min-height:120px}
  select{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;padding:13px;outline:none}
  label.f{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
  .row{display:flex;gap:7px;margin-top:9px}
  .row>*{flex:1;min-width:0}

  .more{width:100%;margin-top:10px;padding:9px;border:1px dashed var(--line);border-radius:11px;
    background:transparent;color:var(--dim);font-size:13px;cursor:pointer}
  .more.on{color:var(--accent);border-color:var(--accent)}

  .save{width:100%;margin-top:14px;padding:16px;border:none;border-radius:13px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .save:active{opacity:.72}
  .save[disabled]{opacity:.45}
  .ghost{width:100%;margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}

  #toast{position:sticky;bottom:14px;margin:14px auto 0;width:max-content;max-width:90%;
    background:var(--ok);color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;
    opacity:0;transition:.2s;pointer-events:none}
  #toast.on{opacity:1}
  #toast.err{background:var(--accent)}
  .queue{margin-top:12px;font-size:12px;color:var(--dim);text-align:center;min-height:16px}
  .queue b{color:var(--accent)}
  .queue button{background:none;border:none;color:var(--accent);font-size:12px;
    text-decoration:underline;cursor:pointer}

  .recent{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
  .recent h4{font-size:12px;color:var(--dim);margin:0 0 8px;font-weight:500}
  .recent ul{margin:0;padding:0}
  .recent li{list-style:none;font-size:13px;color:var(--dim);padding:6px 0;
    border-bottom:1px solid var(--line);display:flex;gap:8px}
  .recent li em{flex:1;min-width:0;font-style:normal;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .recent li i{font-style:normal;font-size:12px;opacity:.75;white-space:nowrap}
  .recent li i.wait{color:var(--accent);opacity:1}

  #plan{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c6);
    border-radius:0 12px 12px 0;padding:15px 17px;margin-bottom:14px}
  #plan h3{font-size:12px;margin:0 0 8px;color:var(--c6);font-weight:600}
  #plan .kw{font-size:19px;font-weight:650;letter-spacing:-.4px;margin-bottom:6px}
  #plan ul{margin:0;padding-left:16px}
  #plan li{font-size:13.5px;padding:1px 0}
  #plan .none{color:var(--dim);font-size:13px}

  #timeuse{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  #timeuse h3{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600}
  #timeuse .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-bottom:9px}
  #timeuse .bar span{display:block}
  #timeuse .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  #timeuse .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
  @media(min-width:560px){ .stats{grid-template-columns:repeat(4,1fr)} }
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .stat .n{font-size:23px;font-weight:650;letter-spacing:-.8px;line-height:1.1}
  .stat .l{color:var(--dim);font-size:11.5px;margin-top:4px}
  .stat.hot{border-color:var(--accent)} .stat.hot .n{color:var(--accent)}

  #q{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:99px;
    background:var(--card);color:var(--ink);font-size:14px;margin-bottom:10px;outline:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);
    color:var(--dim);font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .list{display:grid;gap:9px}
  @media(min-width:560px){ .list{grid-template-columns:1fr 1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .card .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .card .t{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff}
  .card .d{font-size:11px;color:var(--dim)}
  .card .d em{font-style:normal;opacity:.65;margin-left:6px}
  .stat.tap{cursor:pointer}
  .stat.tap.on{border-color:var(--accent);background:var(--accent)}
  .stat.tap.on .n,.stat.tap.on .l{color:#fff}
  .card p{margin:0;font-size:13.5px;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .card p.open{-webkit-line-clamp:unset}
  /* 끝낸 것 — 할일·읽을거리·장소가 done 을 씁니다 */
  .card.done p{text-decoration:line-through;opacity:.55}
  .card a{display:inline-block;margin-top:8px;font-size:12px;color:var(--accent);
    text-decoration:none;word-break:break-all}
  .card .tg{margin-top:8px;font-size:11px;color:var(--dim)}
  /* 카드를 탭하면 열리는 상세. records.json 의 detail 을 그린다 */
  .card .dt{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
  .card .dt dt{color:var(--dim);white-space:nowrap}
  .card .dt dd{margin:0;word-break:break-word}
  .card .dt dd.free{grid-column:1 / -1}
  .card .mk{margin-left:auto;font-size:10.5px;color:var(--accent);white-space:nowrap}
  .blk{margin-top:24px}
  .blk h3{font-size:14px;margin:0 0 10px}

  /* 열두가지 질문 — 매일 보는 게 아니라 꺼내 보는 렌즈라 접어 둡니다 */
  #quest{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:0;margin-bottom:14px;overflow:hidden}
  #quest summary{list-style:none;cursor:pointer;padding:13px 15px;font-size:12px;
    color:var(--dim);display:flex;align-items:center;gap:7px}
  #quest summary::-webkit-details-marker{display:none}
  #quest summary b{color:var(--ink);font-size:13px;font-weight:600}
  #quest summary i{margin-left:auto;font-style:normal;font-size:11px;color:var(--dim)}
  #quest ol{margin:0;padding:0 15px 13px 15px;list-style:none;
    display:flex;flex-direction:column;gap:9px}
  #quest li{display:grid;grid-template-columns:20px 1fr;gap:9px;font-size:13px;line-height:1.5}
  #quest li .no{color:var(--dim);font-size:11.5px;padding-top:2px}
  #quest li .m{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  #quest li.todo .q{color:var(--dim)}

  /* 기록 현황 — 꺼내보는 화면과 성격이 달라 맨 아래로 내렸습니다 */
  #status{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
  #status h3{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600}
  #status .row4{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  @media(min-width:560px){ #status .row4{grid-template-columns:repeat(4,1fr)} }
  #status .s{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px}
  #status .s b{display:block;font-size:19px;font-weight:650;letter-spacing:-.5px;line-height:1.2}
  #status .s span{color:var(--dim);font-size:11px}
  .empty{color:var(--dim);font-size:13.5px;text-align:center;padding:26px 0}

  #setup{padding:20px 0}
  #setup h2{font-size:18px;margin:0 0 6px}
  #setup p{color:var(--dim);font-size:13px;margin:0 0 16px}
  .link{color:var(--accent);font-size:12px;text-align:center;margin-top:18px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

<section id="setup" hidden>
  <h2>연결 설정</h2>
  <p>한 번만 입력하면 이 기기에 저장됩니다. 토큰은 이 페이지에 박히지 않고 기기에만 남습니다.</p>
  <label class="f">GitHub 사용자명</label>
  <input type="text" id="s-owner" placeholder="yoonzzan" autocapitalize="off" autocorrect="off">
  <label class="f">비공개 저장소 이름</label>
  <input type="text" id="s-repo" placeholder="life-os" autocapitalize="off" autocorrect="off">
  <label class="f">Personal access token</label>
  <input type="text" id="s-token" placeholder="github_pat_..." autocapitalize="off" autocorrect="off">
  <p style="margin:14px 0 0;font-size:12px;color:var(--dim)">
    업무·사이드 프로젝트 목록은 저장소에서 자동으로 불러옵니다.</p>
  <button class="save" id="s-save">시작하기</button>
</section>

<div id="app" hidden>
  <nav class="tabs">
    <button data-v="write" class="on">✍️ 기록</button>
    <button data-v="view">📊 보기</button>
  </nav>

  <section id="v-write">
    <nav class="modes">
      <button data-m="quick" class="on">빠른 기록</button>
      <button data-m="morning">🌅 아침</button>
      <button data-m="night">🌙 밤</button>
      <button data-m="english">🇬🇧 영어</button>
    </nav>

    <div id="m-quick">
      <div class="types" id="types"></div>
      <textarea id="q-body" placeholder="무슨 일이든" maxlength="16384"></textarea>
      <div id="q-basic"></div>
      <button class="more" id="q-more" hidden>＋ 상세 입력</button>
      <div id="q-detail" hidden></div>
      <div class="row"><input type="text" id="q-tags" placeholder="태그 (선택)" maxlength="16384"></div>
      <button class="save" id="q-save">저장</button>
      <div class="queue" id="queue"></div>
      <div class="recent"><h4>최근 기록</h4><ul id="recent"></ul></div>
    </div>

    <div id="m-morning" hidden>
      <div id="mo-fields"></div>
      <button class="more" id="mo-more">＋ 상세 입력</button>
      <div id="mo-detail" hidden></div>
      <button class="save" id="mo-save">아침 기록 저장</button>
    </div>

    <div id="m-night" hidden>
      <div id="ni-fields"></div>
      <button class="more" id="ni-more">＋ 상세 입력</button>
      <div id="ni-detail" hidden></div>
      <button class="save" id="ni-save">밤 기록 저장</button>
    </div>

    <div id="m-english" hidden>
      <div id="en-fields"></div>
      <button class="save" id="en-save">영어일기 저장</button>
    </div>
  </section>

  <section id="v-view" hidden>
    <div id="plan"></div>
    <details id="quest" hidden></details>
    <div id="timeuse" hidden></div>
    <div class="stats" id="stats"></div>
    <input id="q" placeholder="검색…">
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>해당하는 기록이 없습니다.</div>
    <div class="blk" id="s-link" hidden><h3>📖 안 읽은 링크</h3><div class="list" id="g-link"></div></div>
    <div class="blk" id="s-place" hidden><h3>📍 가고싶은 곳</h3><div class="list" id="g-place"></div></div>
    <button class="ghost" id="digest">이번 주 회고 재료 복사</button>
    <div id="status"></div>
    <div class="queue" id="built"></div>
  </section>

  <div class="link" id="reset">연결 설정 변경</div>
</div>

<div id="toast"></div>
</div>

<script>
'use strict';
const LS = { cfg:'yz-cfg', q:'yz-queue', r:'yz-recent', t:'yz-type', d:'yz-data', p:'yz-proj' };

const TYPES = [
  { id:'memo',  e:'💭', l:'메모'   }, { id:'todo',  e:'✅', l:'할일'   },
  { id:'money', e:'💰', l:'소비'   }, { id:'link',  e:'🔗', l:'읽을거리' },
  { id:'learn', e:'🧩', l:'100단어' }, { id:'place', e:'📍', l:'장소'   },
  { id:'work',  e:'💼', l:'업무'   }, { id:'side',  e:'🚀', l:'사이드' },
  { id:'blog',  e:'📝', l:'쓸거리'  },
  /* 열두가지 좋아하는 질문 — 날짜 로그가 아니라 12개로 완결되는 목록이다.
     새 줄을 덧붙이지 않고 표의 빈 번호를 채운다 */
  { id:'question', e:'❓', l:'질문' }
];

/* 소비 카테고리 9종 — 정본: 00-system/03-guides/spending-categories.md (의도된 미러) */
const CATS = ['식비','카페·간식','교통','쇼핑','건강·뷰티','여가·문화','여행','구독·디지털','기타'];
const CAT_RULES = [
  [/커피|카페|음료|라떼|아메리카노|디저트|빵|베이커리/, '카페·간식'],
  [/식사|밥|점심|저녁|아침|식당|배달|편의점|치킨|피자/, '식비'],
  [/교통|버스|지하철|택시|기차|ktx|주유/i,               '교통'],
  [/쇼핑|옷|신발|생활용품|전자|선물/,                     '쇼핑'],
  [/화장품|뷰티|스킨|크림|병원|약국|헬스|필라테스/,       '건강·뷰티'],
  [/영화|공연|책|스포츠|전시|피클볼|테니스/,              '여가·문화'],
  [/숙박|호텔|투어|기념품|항공|여행/,                     '여행'],
  [/앱|구독|멤버십|넷플|유튜브|클로드|chatgpt/i,          '구독·디지털']
];

/* ─────────────────────────────────────────────
   타입별 입력 필드
   basic  = 항상 보임 (캡처 속도 유지)
   detail = '＋ 상세 입력' 눌러야 펼쳐짐 (탈리에 있던 항목 전부 복원)
   [키, 라벨, 종류] · 종류: text | num | area | sel:a|b|c | proj
   ───────────────────────────────────────────── */
/* 💭 메모는 성격이 다른 셋을 한 버튼에 담습니다.
   빠른 캡처는 내용 한 칸으로 끝내고, 상세를 열면 종류에 따라 칸이 바뀝니다.
   원본: 💡영감 수집 / 📒 Idea note / 🎧 사운드 로그 */
const MEMO_KINDS = {
  '':       [],
  '영감':    [['perception','왜 눈에 띄었나','area'], ['source','출처','text']],
  '아이디어': [['title','제목','text'], ['note','비고','area']],
  '사운드':   [['place','장소','text'], ['sound','소리','text'],
              ['situation','상황','area'], ['observation','관찰','area'],
              ['mood','기분','text']],
};

const FIELDS = {
  memo:  { detail:[['kind','종류','sel:영감|아이디어|사운드']] },
  todo:  { detail:[['due','기한','text']] },
  money: { basic:[['amount','금액','num'], ['category','카테고리','cat']],
           /* 키는 payment_method 다. capture_events.py 의 검증 목록과 v1 daily_money
              스키마가 그 이름을 쓴다. 앱만 pay 로 보내던 것을 맞췄다 */
           detail:[['payment_method','결제수단','text']] },
  /* 입수 경로는 Tally 「리딩 리스트」에 있던 항목인데 앱으로 옮기며 빠졌다.
     도서관·구입 자료는 링크가 없는 게 정상이라 URL 과 별개로 남긴다. */
  /* 상세 순서는 탈리 「리딩 리스트」 원본 10항목을 그대로 따른다.
     발행일·발행경로·분류·읽기 시작은 앱으로 옮기며 빠졌던 칸이다 —
     40-archive-read-later.md 렌더러는 이미 그 줄들을 그릴 준비가 되어 있었다. */
  link:  { basic:[['channel','입수 경로','sel:구입|도서관|온라인']],

function toast(msg, err){
  const t = $('toast');
  t.textContent = msg; t.className = 'on' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className = '', 2000);
}

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- GitHub ---------- */
async function gh(path, opts){
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  const res = await fetch(url, Object.assign({
    headers:{ 'Authorization':`Bearer ${cfg.token}`, 'Accept':'application/vnd.github+json' }
  }, opts||{}));
  if(!res.ok) throw new Error(`GitHub ${res.status}`);
  return res.json();
}

async function putCapture(payload){
  const id = payload.id;
  await gh(`capture/pending/${id}.json`, {
    method:'PUT',
    headers:{ 'Authorization':`Bearer ${cfg.token}`, 'Accept':'application/vnd.github+json',
              'Content-Type':'application/json' },
    body: JSON.stringify({
      message: `capture: ${payload.type} ${id}`,
      content: b64encode(JSON.stringify(payload, null, 1))
    })
  });
}

/* 프로젝트 목록은 저장소 폴더 이름에서 그대로 가져옵니다.
   손으로 입력하면 오타가 나고, 프로젝트를 추가할 때마다 앱 설정을 고쳐야 합니다. */
async function loadProjects(force){
  const c = ls.get(LS.p, null);
  if(!force && c && Date.now() - c.at < 7*864e5){
    cfg.work = c.work; cfg.side = c.side; return;
  }
  try{
    const [w, s] = await Promise.all([
      gh('10-projects/11-work-projects'),
      gh('10-projects/12-side-projects'),
    ]);
    const dirs = a => (Array.isArray(a) ? a : []).filter(x => x.type==='dir')
                                                 .map(x => x.name).sort();
    cfg.work = dirs(w); cfg.side = dirs(s);
    ls.set(LS.p, { work:cfg.work, side:cfg.side, at:Date.now() });
    if(st.type==='work' || st.type==='side') syncFields();
  }catch(e){
    if(c){ cfg.work = c.work; cfg.side = c.side; }     // 오프라인이면 캐시 사용
  }
}

/* GitHub API 는 Cache-Control: private, max-age=60 을 준다. 그대로 두면 보기 탭을
   열어도 최대 60초 동안 브라우저가 옛 records.json 을 재사용한다. Actions 반영이
   30초쯤 걸리므로 둘이 겹치면 방금 넣은 기록이 90초까지 안 보인다. */
async function loadData(){
  const j = await gh('records.json?ref=' + (cfg.branch || 'main'), { cache:'no-store' });
  const d = JSON.parse(b64decode(j.content));
  DATA = d; ls.set(LS.d, d);
  return d;
}

/* ---------- 유틸 ---------- */
function newId(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2,6)}`;
}
function nowLocal(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function guessCat(t){ for(const [re,c] of CAT_RULES) if(re.test(t)) return c; return '기타'; }
function splitAmount(t){
  const m = String(t).match(/([0-9][0-9,]*)\s*원?\s*$/);
  return m ? { amount:m[1].replace(/,/g,''), rest:t.slice(0,m.index).trim() } : { amount:'', rest:t.trim() };
}
function extractUrl(t){ const m = String(t||'').match(/https?:\/\/[^\s]+/); return m ? m[0] : ''; }
function host(u){ try{ return new URL(u).hostname.replace('www.',''); }catch(e){ return String(u).slice(0,40); } }

/* ---------- 필드 렌더러 ---------- */
function fieldHtml(prefix, [key, label, kind]){
  const id = `${prefix}-${key}`;
  const ml = ` maxlength="${maxLen(key)}"`;
  if(kind === 'area')
    return `<label class="f" for="${id}">${esc(label)}</label>
            <textarea id="${id}" data-k="${key}"${ml} style="min-height:64px"></textarea>`;
  if(kind === 'num')
    return `<label class="f" for="${id}">${esc(label)}</label>
            <input type="text" inputmode="numeric" id="${id}" data-k="${key}"${ml}>`;
  if(kind === 'cat')
    return `<label class="f" for="${id}">${esc(label)}</label>
            <select id="${id}" data-k="${key}"><option value="">자동 분류</option>
            ${CATS.map(c=>`<option>${c}</option>`).join('')}</select>`;
  if(kind === 'proj'){
    const list = (st.type==='work' ? cfg.work : cfg.side) || [];
    return `<label class="f" for="${id}">${esc(label)}</label>
            <select id="${id}" data-k="${key}">${
              list.length ? list.map(p=>`<option>${esc(p)}</option>`).join('')
                          : '<option value="">불러오는 중…</option>'}</select>`;
  }
  if(kind.startsWith('sel:'))
    return `<label class="f" for="${id}">${esc(label)}</label>
            <select id="${id}" data-k="${key}"><option value=""></option>
            ${kind.slice(4).split('|').map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  return `<label class="f" for="${id}">${esc(label)}</label>
          <input type="text" id="${id}" data-k="${key}"${ml}>`;
}

function render(prefix, container, spec){
  $(container).innerHTML = (spec||[]).map(f => fieldHtml(prefix, f)).join('');
}

function collect(container, into){
  $(container).querySelectorAll('[data-k]').forEach(el => {
    const v = String(el.value||'').trim();
    if(v) into[el.dataset.k] = v;
  });
  return into;
}

function clearFields(...containers){
  containers.forEach(c => $(c).querySelectorAll('[data-k]').forEach(el => el.value = ''));
}

/* 언제 눌렀는지를 함께 보여줍니다. 오늘 것은 시각만, 지난 것은 날짜까지.
   앱을 새로 깔기 전에 쌓인 기록에는 이 값이 없어 그 줄만 시각이 비어 있습니다 */
function recentWhen(at){
  const [d, t] = String(at||'').split(' ');
  if(!t) return '';
  return d === nowLocal().slice(0,10) ? t : `${d.slice(5).replace('-','/')} ${t}`;
}
/* 목록은 올리기 전에 쌓으므로, 남아 있다는 것이 올라갔다는 뜻은 아닙니다.
   아직 못 올린 것을 큐에서 직접 확인해 표시합니다 — 큐가 유일한 근거라
   따로 상태를 들고 있다가 어긋날 일이 없고, 나중에 전송되면 알아서 사라집니다.
   여기서 표시가 없다는 건 폰이 올리는 데까지 성공했다는 뜻입니다.
   그 뒤 저장소에서 반영되는 것은 앱이 알 수 없습니다 — 보기 탭에서 확인합니다. */
function renderRecent(){
  const waiting = new Set(ls.get(LS.q, []).map(p => p.id));
  const r = ls.get(LS.r, []).slice(0,6);
  $('recent').innerHTML = r.length
    ? r.map(x => {
        const w = recentWhen(x.at), wait = !!x.id && waiting.has(x.id);
        const mark = wait ? `<i class="wait">⏳ ${esc(w) || '대기'}</i>`
                          : (w ? `<i>${esc(w)}</i>` : '');
        return `<li><span>${x.e}</span><em>${esc(x.text)}</em>${mark}</li>`;
      }).join('')
    : '<li style="border:none">아직 없습니다</li>';
}
function renderQueue(){
  const q = ls.get(LS.q, []);
  $('queue').innerHTML = q.length ? `전송 대기 <b>${q.length}</b>건 <button id="flush">지금 보내기</button>` : '';
  if(q.length) $('flush').onclick = () => flush(true);
}
async function flush(loud){
  const q = ls.get(LS.q, []);
  if(!q.length) return;
  const left = [];
  for(const p of q){ try{ await putCapture(p); }catch(e){ left.push(p); } }
  ls.set(LS.q, left); renderQueue(); renderRecent();   // 올라간 줄의 대기 표시를 뗀다
  if(loud) toast(left.length ? `${left.length}건 남음` : '전송 완료', !!left.length);
}
async function submit(payload, okMsg){
  payload.id = newId();
  payload.captured_at = nowLocal();
  const rec = ls.get(LS.r, []);
  rec.unshift({ e:(TYPES.find(t=>t.id===payload.type)||{}).e || '📝',
                text:(payload.body||'').slice(0,40), at:payload.captured_at,
                id:payload.id });   // 큐에 남아 있는지 대조하는 데 씁니다
  ls.set(LS.r, rec.slice(0,20)); renderRecent();
  /* 여기서 끝난 건 capture/pending 에 올린 것까지다. 실제 반영은 Actions 가 나중에 한다.
     '저장됨' 은 반영 완료로 읽혀서, 그 사이 실패해도 성공한 줄 알게 된다. */
  /* '곧' 이 얼마인지 없으면 저장 직후 보기 탭을 열고 없다고 여긴다 (2026-08-14 실제) */
  try{ await putCapture(payload); toast(okMsg || '기록함 · 30초쯤 뒤 보기 탭에'); }
  catch(e){
    const q = ls.get(LS.q, []); q.push(payload); ls.set(LS.q, q);
    renderQueue(); renderRecent();                     // 방금 줄에 대기 표시를 붙인다
    toast('오프라인 — 큐에 보관', true);
  }
}

$('q-save').onclick = async () => {
  const raw = $('q-body').value.trim();
  if(!raw) return toast('내용을 입력하세요', true);
  const p = { type:st.type, body:raw, tags:$('q-tags').value.trim() };
  collect('q-basic', p); collect('q-detail', p);

  if(st.type==='money'){
    const s = splitAmount(raw);
    if(!p.amount) p.amount = s.amount;
    if(s.amount) p.body = s.rest || raw;
    p.category = p.category || guessCat(raw);
    if(!p.amount) return toast('금액을 입력하세요', true);
  }
  /* 업무·사이드는 서버에서 project 가 필수다. 목록을 못 불러왔을 때 '불러오는 중…'
     이 선택돼 있으면 값이 빈 문자열이고, collect 가 빈 값을 키째 빼서 project 없이 전송된다.
     그 payload 는 invalid_project 로 영구 격리되는데 폰에는 저장됐다고 뜬다. 여기서 막는다. */
  if((st.type==='work' || st.type==='side') && !p.project)
    return toast('프로젝트 목록을 불러오는 중입니다 — 잠시 후 다시', true);

  /* extractUrl 은 못 찾으면 '' 를 준다. collect 처럼 빈 값은 키째 뺀다 — 검증기가 거부한다 */
  if(st.type==='link' && !p.url){
    const found = extractUrl(raw);
    if(found) p.url = found; else delete p.url;
  }
  /* photo 는 스키마상 bool 이다. 선택지 '있음' 문자열을 그대로 보내면 invalid_photo */
  if(st.type==='blog' && 'photo' in p) p.photo = true;

  $('q-save').disabled = true;
  await submit(p);
  $('q-save').disabled = false;
  $('q-body').value=''; $('q-tags').value='';
  clearFields('q-basic','q-detail');
};

$('mo-save').onclick = async () => {
  const p = collect('mo-detail', collect('mo-fields', { type:'morning' }));
  if(!p.agenda && !p.keyword) return toast('안건이나 키워드를 적어주세요', true);
  p.body = [p.keyword, p.agenda].filter(Boolean).join(' / ');
  await submit(p, '아침 기록함 · 30초쯤 뒤 보기 탭에');
  clearFields('mo-fields','mo-detail');
};

$('ni-save').onclick = async () => {
  const p = collect('ni-detail', collect('ni-fields', { type:'night' }));
  if(!p.today) return toast('오늘 어땠는지 한 줄이라도', true);
  p.body = p.today;
  await submit(p, '밤 기록함 · 30초쯤 뒤 보기 탭에');
  clearFields('ni-fields','ni-detail');
};

$('en-save').onclick = async () => {
  const p = collect('en-fields', { type:'english' });
  if(!p.en && !p.ko) return toast('영어나 한국어 중 하나는 적어주세요', true);
  p.body = p.en || p.ko;
  await submit(p, '영어일기 기록함 · 30초쯤 뒤 보기 탭에');
  clearFields('en-fields');
};

/* ---------- 보기 ---------- */
function prepData(){
  ALL = (DATA.records||[]).map(r => ({...r, _d:new Date(String(r.date).replace(/-/g,'/'))}))
                          .sort((a,b) => b._d - a._d);
}
function renderPlan(){
  const p = DATA.plan;
  if(!p || (!p.keyword && !(p.items||[]).length)){
    $('plan').innerHTML = `<h3>🌅 오늘의 구상</h3><div class="none">오늘 아침 기록이 없습니다</div>`;
    return;
  }
  $('plan').innerHTML = `<h3>🌅 오늘의 구상</h3>
    ${p.keyword ? `<div class="kw">${esc(p.keyword)}</div>` : ''}
    ${(p.items||[]).length ? `<ul>${p.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>` : ''}`;
}
/* 영역 5종 — 12_lifeos.py 의 AREAS 와 동일하게 유지 */
const AREA_COLOR = {'일':'var(--c3)','일상':'var(--c1)','사람':'var(--c5)',
                    '성장':'var(--c2)','비즈니스':'var(--c4)'};
function renderTimeuse(){
  const t = DATA.timeuse || {};
  const entries = Object.entries(t).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
  if(!entries.length){ $('timeuse').hidden = true; return; }
  $('timeuse').hidden = false;
  const total = entries.reduce((s,[,v]) => s+v, 0);
  const fmt = v => v >= 60 ? `${Math.round(v/60)}시간` : `${v}분`;
  $('timeuse').innerHTML = `<h3>이번 주 시간 배분 · 총 ${fmt(total)}</h3>
    <div class="bar">${entries.map(([k,v]) =>
      `<span style="width:${(v/total*100).toFixed(1)}%;background:${AREA_COLOR[k]||'var(--dim)'}"></span>`).join('')}</div>
    <div class="lg">${entries.map(([k,v]) =>
      `<span><i style="background:${AREA_COLOR[k]||'var(--dim)'}"></i>${esc(k)} ${fmt(v)}</span>`).join('')}</div>`;
}

/* 열두가지 좋아하는 질문 — 공명하는 내용을 거르는 렌즈.
   정본은 49-questions.md 이고 여기서는 읽기만 합니다. 기록은 ❓ 질문 타입으로 합니다. */
function renderQuestions(){
  const qs = DATA.questions || [];
  if(!qs.length){ $('quest').hidden = true; return; }
  $('quest').hidden = false;
  const done = qs.filter(q => q.q).length;
  $('quest').innerHTML =
    `<summary><b>❓ 열두가지 질문</b> 꺼내보기<i>${done}/${qs.length}</i></summary>
     <ol>${qs.map(q => `<li class="${q.q ? '' : 'todo'}">
       <span class="no">${q.n}</span>
       <span><span class="q">${q.q ? esc(q.q) : '아직 비어 있음'}</span>
       ${q.note || q.area ? `<span class="m">${[q.note, q.area].filter(Boolean).map(esc).join(' · ')}</span>` : ''}
       </span></li>`).join('')}</ol>`;
}

/* 지금 처리할 것만 위에 둡니다. 눌러서 거를 수 있는 두 칸입니다. */
function renderStats(){
  const links = ALL.filter(r => r.type==='읽을거리' && !r.done).length;
  const places = ALL.filter(r => r.type==='장소' && !r.done).length;
  const on = f => (st.tag===f && st.undone) ? 'on' : '';
  $('stats').innerHTML = `
    <div class="stat tap ${on('읽을거리')}" data-f="읽을거리">
      <div class="n">${links}</div><div class="l">안 읽은 링크 ›</div></div>
    <div class="stat tap ${on('장소')}" data-f="장소">
      <div class="n">${places}</div><div class="l">가고싶은 곳 ›</div></div>`;
  $('stats').querySelectorAll('.tap').forEach(b => b.onclick = () => {
    const same = st.tag === b.dataset.f && st.undone;
    st.tag = same ? '' : b.dataset.f;
    st.undone = !same;
    renderStats(); renderList();
    $('list').scrollIntoView({ behavior:'smooth', block:'start' });
  });
}
function renderChips(){
  const items = ['전체', ...VIEW_TYPES.filter(t => ALL.some(r=>r.type===t))];
  $('chips').innerHTML = items.map(t => {
    const n = t==='전체' ? ALL.length : ALL.filter(r=>r.type===t).length;
    return `<button class="chip ${st.tag===t||(!st.tag&&t==='전체')?'on':''}" data-c="${t}">${t} ${n}</button>`;
  }).join('');
  /* 위 칸과 같은 st.tag 를 쓰므로 위 칸도 다시 그립니다.
     안 그리면 위에서 고른 표시가 켜진 채 남아 목록과 어긋납니다 */
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    st.tag = b.dataset.c==='전체' ? '' : b.dataset.c;
    st.undone = false;
    renderStats(); renderList();
  });
}
function card(r){
  // date = 기록이 속한 날짜 · saved = 실제로 저장한 시각
  const d = r._d && r._d.getTime()
    ? r._d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'})
        .replace(/\.$/,'')
    : '';
  const det = r.detail || [];
  return `<article class="card${r.done ? ' done' : ''}">
    <div class="meta"><span class="t" style="background:${COLOR[r.type]||'var(--dim)'}">${esc(r.type)}</span>
    <span class="d">${d}${r.saved ? `<em>저장 ${esc(r.saved)}</em>` : ''}</span>
    ${det.length ? `<span class="mk" data-n="${det.length}">＋${det.length}</span>` : ''}</div>
    <p>${esc(r.body||'')}</p>
    ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(host(r.url))}</a>` : ''}
    ${(r.tags||[]).length ? `<div class="tg">#${r.tags.map(esc).join(' #')}</div>` : ''}
    ${det.length ? `<dl class="dt" hidden>${det.map(x => {
      const i = x.indexOf(': ');
      return i > 0
        ? `<dt>${esc(x.slice(0, i))}</dt><dd>${esc(x.slice(i + 2))}</dd>`
        : `<dd class="free">${esc(x)}</dd>`;
    }).join('')}</dl>` : ''}
  </article>`;
}
/* 본문을 탭하면 잘린 글이 펼쳐지고, 상세가 있으면 함께 열린다 */
function bind(el){
  el.querySelectorAll('.card').forEach(c => {
    const p = c.querySelector('p'); if(!p) return;
    const dl = c.querySelector('.dt'), mk = c.querySelector('.mk');
    p.onclick = () => {
      const open = p.classList.toggle('open');
      if(dl) dl.hidden = !open;
      if(mk) mk.textContent = open ? '접기' : `＋${mk.dataset.n}`;
    };
  });
}
function renderList(){
  renderChips();
  const q = st.q.toLowerCase();
  const list = ALL.filter(r => {
    if(st.tag && r.type!==st.tag) return false;
    if(st.undone && r.done) return false;
    if(q && !((r.body||'')+(r.tags||[]).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  }).slice(0,80);
  $('list').innerHTML = list.map(card).join('');
  $('empty').hidden = list.length>0;
  bind($('list'));
  ['읽을거리','장소'].forEach((t,i) => {
    const id = i===0 ? 'link' : 'place';
    const g = ALL.filter(r => r.type===t && !r.done).slice(0,10);
    $('s-'+id).hidden = !g.length;
    $('g-'+id).innerHTML = g.map(card).join('');
    bind($('g-'+id));
  });
}
/* 얼마나 쓰고 있는지는 꺼내보는 일과 성격이 달라 맨 아래에 둡니다.
   위에 두면 매번 눈에 들어오는데, 정작 눌러서 할 일이 없는 숫자입니다. */
function renderStatus(){
  const week = Date.now() - 7*864e5;
  const month = new Date(); month.setDate(1); month.setHours(0,0,0,0);
  const w = ALL.filter(r => r._d.getTime() >= week).length;
  const m = ALL.filter(r => r._d.getTime() >= month.getTime()).length;
  const last = ALL.length
    ? ALL[0]._d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}).replace(/\.$/,'')
    : '—';
  $('status').innerHTML = `<h3>기록 현황</h3>
    <div class="row4">
      <div class="s"><b>${w}</b><span>이번 주</span></div>
      <div class="s"><b>${m}</b><span>이번 달</span></div>
      <div class="s"><b>${DATA.streak||0}</b><span>연속 기록일</span></div>
      <div class="s"><b>${last}</b><span>마지막 기록</span></div>
    </div>`;
}

function renderView(){
  prepData(); renderPlan(); renderQuestions(); renderTimeuse();
  renderStats(); renderList(); renderStatus();
  $('built').textContent = DATA.built ? `${ALL.length}건 · ${DATA.built} 기준` : '';
}

$('digest').onclick = async () => {
  const since = Date.now() - 7*864e5;
  const pick = ALL.filter(r => r._d.getTime() >= since && DIGEST.includes(r.type));
  let out = `## 지난 7일 기록 (${pick.length}건)\n\n`;
  DIGEST.forEach(t => {
    const g = pick.filter(r=>r.type===t);
    if(!g.length) return;
    out += `### ${t} (${g.length})\n`;
    g.slice().reverse().forEach(r => {
      out += `- [${r._d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}] ${(r.body||'').replace(/\n/g,' ')}\n`;
    });
    out += '\n';
  });
  /* 타입 이름은 '읽을거리' 다. '링크' 로 걸러 늘 0건이라 이 묶음에 안 붙고 있었다 */
  const links = ALL.filter(r=>r.type==='읽을거리' && !r.done).slice(0,10);
  if(links.length){ out += `### 안 읽은 링크\n`; links.forEach(r=> out += `- ${r.body} ${r.url||''}\n`); }
  try{ await navigator.clipboard.writeText(out); toast('복사됨 — Claude에 붙여넣으세요'); }
  catch(e){ toast('복사 실패', true); }
};

/* ---------- 탭 ---------- */
function showView(v){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v===v));
  $('v-write').hidden = v!=='write';
  $('v-view').hidden  = v!=='view';
  if(v==='view'){
    renderView();
    loadData().then(()=>renderView()).catch(()=> toast('데이터 불러오기 실패', true));
  }
}
function showMode(m){
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m===m));
  ['quick','morning','night','english'].forEach(x => $('m-'+x).hidden = x!==m);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showView(b.dataset.v));
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => showMode(b.dataset.m));
$('q').oninput = e => { st.q = e.target.value; renderList(); };

/* ---------- 설정 ---------- */
$('s-save').onclick = () => {
  const owner = $('s-owner').value.trim(), repo = $('s-repo').value.trim(), token = $('s-token').value.trim();
  if(!owner || !repo || !token) return toast('사용자명·저장소·토큰을 넣어주세요', true);
  ls.set(LS.cfg, { owner, repo, token, branch:'main' });
  localStorage.removeItem(LS.p);              // 프로젝트 목록 새로 받도록
  location.reload();
};
$('reset').onclick = () => {
  const c = ls.get(LS.cfg, {});
  $('s-owner').value=c.owner||''; $('s-repo').value=c.repo||''; $('s-token').value=c.token||'';
  $('app').hidden = true; $('setup').hidden = false;
};

/* ---------- 부팅 ---------- */
(function boot(){
  cfg = ls.get(LS.cfg, {});
  if(!cfg.token){ $('setup').hidden = false; return; }
  $('app').hidden = false;

  st.type = ls.get(LS.t, 'memo');
  DATA = ls.get(LS.d, DATA);
  render('mo', 'mo-fields', MORNING_BASIC);
  render('mo', 'mo-detail', MORNING_DETAIL);
  render('ni', 'ni-fields', NIGHT_BASIC);
  render('ni', 'ni-detail', NIGHT_DETAIL);
  render('en', 'en-fields', ENGLISH);
  renderTypes(); syncFields(); renderRecent(); renderQueue();
  flush(false);
  loadProjects(false);
  window.addEventListener('online', () => { flush(true); loadProjects(true); });

  // 딥링크: ?m=morning | night | view  (텔레그램 알림이 이 주소로 보냅니다)
  const m = new URLSearchParams(location.search).get('m');
  if(m === 'view'){ showView('view'); showMode('quick'); return; }
  if(['morning','night','english','quick'].includes(m)){ showView('write'); showMode(m); return; }

  showView('write');
  const h = new Date().getHours();
  showMode((h>=6 && h<11) ? 'morning' : (h>=21 || h<3) ? 'night' : 'quick');
})();
</script>
</body>
</html>
